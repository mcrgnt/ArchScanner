name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ArchScanner.xcodeproj \
            -scheme ArchScanner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Pack IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP"
          rm -rf Payload ArchScanner_unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r ArchScanner_unsigned.ipa Payload
          ls -lh ArchScanner_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ArchScanner_unsigned
          path: ArchScanner_unsigned.ipa
          if-no-files-found: error
