# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BIN: bin/archscanner

tasks:
  test:
    desc: Run archscanner unit tests
    cmds:
      - go test ./...

  build:
    desc: Build archscanner binary
    cmds:
      - mkdir -p bin
      - go build -o {{.BIN}} ./cmd/archscanner

  run:
    desc: Build and run archscanner (reads .env in this directory)
    deps: [build]
    dotenv: ['.env']
    cmds:
      - |
        api_host="${ARCHSCANNER_SERVER_HTTP_HOST:-0.0.0.0}"
        api_port="${ARCHSCANNER_SERVER_HTTP_PORT:-8780}"
        ops_host="${ARCHSCANNER_OPS_HTTP_HOST:-0.0.0.0}"
        ops_port="${ARCHSCANNER_OPS_HTTP_PORT:-8781}"
        echo "archscanner listening:"
        echo "  API  ${api_host}:${api_port}  (POST/GET /api/v1/...)"
        echo "  OPS  ${ops_host}:${ops_port}"
        # if bound on all/loopback — show addresses the phone can use
        if [ "$api_host" = "0.0.0.0" ] || [ "$api_host" = "127.0.0.1" ]; then
          echo "connect from phone / VPN:"
          ip -4 -o addr show scope global 2>/dev/null | awk -v p="$api_port" '{
            split($4, a, "/"); print "  http://" a[1] ":" p
          }' || true
        else
          echo "connect: http://${api_host}:${api_port}"
        fi
        echo
        exec {{.BIN}}
